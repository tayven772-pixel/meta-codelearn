# Add these locations INSIDE the active HTTPS server block for the site.
# They intentionally do not proxy unrelated /api routes such as future OAuth providers.
location = /api/health {
    proxy_pass http://127.0.0.1:3001/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/auth/register {
    proxy_pass http://127.0.0.1:3001/api/auth/register;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/auth/login {
    proxy_pass http://127.0.0.1:3001/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/auth/verify {
    proxy_pass http://127.0.0.1:3001/api/auth/verify;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/auth/me {
    proxy_pass http://127.0.0.1:3001/api/auth/me;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/auth/logout {
    proxy_pass http://127.0.0.1:3001/api/auth/logout;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Private Meta AI (Ollama) status and chat endpoints.
location ^~ /api/auth/admin/ai/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
}
