name: Auto-deploy to VPS

# Deploys production on every push to main.
# The heavy lifting happens ON THE VPS: it pulls main, installs, builds and
# restarts the auth service, then the static build is published to the web root.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST         - hostname or IP of the VPS
#   VPS_USER         - SSH user (must have passwordless sudo for the deploy commands)
#   VPS_SSH_KEY      - private half of the deploy key (ed25519), full PEM block
#   VPS_KNOWN_HOSTS  - optional; output of `ssh-keyscan -H <host>`. Strongly recommended.
#   VPS_PORT         - optional; defaults to 22
#
# No sudo is needed when /var/www/html is writable by VPS_USER, and the auth
# service is only restarted when server/auth.js actually changed since the last
# successful deploy. Otherwise VPS_USER needs passwordless sudo for cp and for
# restarting the auth service; the log prints the exact one-line fix if it is missing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys run at the same time; queue instead of cancelling,
# so a half-finished publish can never be interrupted.
concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing repository secret $name (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required secrets are present."

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            echo "HOST_KEY_MODE=strict" >> "$GITHUB_ENV"
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set. Falling back to Trust On First Use (accept-new). Set VPS_KNOWN_HOSTS to pin the host key."
            echo "HOST_KEY_MODE=accept-new" >> "$GITHUB_ENV"
          fi

      - name: Deploy on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          PORT="${VPS_PORT:-22}"
          if [ "$HOST_KEY_MODE" = "strict" ]; then
            HOST_KEY_OPT="-o StrictHostKeyChecking=yes"
          else
            HOST_KEY_OPT="-o StrictHostKeyChecking=accept-new"
          fi
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            $HOST_KEY_OPT -p "$PORT" \
            "$VPS_USER@$VPS_HOST" "bash -s" <<'REMOTE'
          set -eu

          APP_DIR=/opt/meta-codelearn
          WEB_ROOT=/var/www/html
          SERVICE=meta-codelearn-auth.service
          HEALTH_URL=http://127.0.0.1:3001/api/health
          BACKUP_ROOT="$HOME/meta-web-backups"
          MARKER="$HOME/.meta-deployed-sha"
          SUDOERS_FIX="echo '$(id -un) ALL=(ALL) NOPASSWD: /usr/bin/cp, /bin/cp, /usr/bin/systemctl restart $SERVICE' | sudo tee /etc/sudoers.d/meta-deploy >/dev/null && sudo chmod 0440 /etc/sudoers.d/meta-deploy && sudo visudo -cf /etc/sudoers.d/meta-deploy"

          echo "==> Preflight"
          command -v git >/dev/null 2>&1 || { echo "ERROR: git is not installed on the VPS"; exit 1; }
          command -v npm >/dev/null 2>&1 || { echo "ERROR: npm is not installed on the VPS"; exit 1; }
          command -v curl >/dev/null 2>&1 || { echo "ERROR: curl is not installed on the VPS"; exit 1; }
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 20) { console.error("Node " + process.versions.node + " is too old; the build needs Node 20+"); process.exit(1); }' \
            || { echo "ERROR: Node 20 or newer is required on the VPS"; exit 1; }
          echo "node $(node -v) / npm $(npm -v)"
          echo "user: $(id -un) | app dir: $APP_DIR | web root: $WEB_ROOT"

          if [ -w "$WEB_ROOT" ]; then
            PUBLISH_MODE=direct
            echo "publish mode: direct - $WEB_ROOT is writable by $(id -un), so no sudo is needed"
          else
            PUBLISH_MODE=sudo
            echo "publish mode: sudo - $WEB_ROOT is not writable by $(id -un)"
          fi

          PROBE_DIR=$(mktemp -d)
          : > "$PROBE_DIR/src"
          if sudo -n cp -a "$PROBE_DIR/src" "$PROBE_DIR/dst" >/dev/null 2>&1; then
            echo "sudo -n cp: allowed"
          else
            echo "sudo -n cp: NOT allowed (passwordless sudo is not configured for cp)"
          fi
          rm -rf "$PROBE_DIR"

          test -d "$APP_DIR/.git" || { echo "ERROR: $APP_DIR is not a git checkout"; exit 1; }
          cd "$APP_DIR"

          echo "==> Fetch origin/main"
          git fetch --prune origin main
          BEFORE=$(git rev-parse HEAD)
          TARGET=$(git rev-parse origin/main)
          echo "current: $BEFORE"
          echo "target:  $TARGET"

          if [ "$BEFORE" = "$TARGET" ]; then
            echo "Already at origin/main; rebuilding to guarantee the published site matches it."
          elif git merge-base --is-ancestor "$BEFORE" "$TARGET"; then
            git merge --ff-only "$TARGET"
          else
            echo "WARNING: the checkout has commits that are not on origin/main. They will be replaced:"
            git log --oneline "$TARGET..$BEFORE" || true
            git reset --hard "$TARGET"
          fi
          echo "deploying $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

          # Only restart the auth service when server/auth.js really changed since the last
          # successful deploy, so a static-only deploy never needs sudo.
          LAST_DEPLOYED=$(cat "$MARKER" 2>/dev/null || true)
          [ -n "$LAST_DEPLOYED" ] || LAST_DEPLOYED="$BEFORE"
          AUTH_CHANGED=0
          if git cat-file -e "$LAST_DEPLOYED^{commit}" 2>/dev/null; then
            if ! git diff --quiet "$LAST_DEPLOYED" "$TARGET" -- server/auth.js; then
              AUTH_CHANGED=1
            fi
          fi
          if [ "$AUTH_CHANGED" = "1" ]; then
            echo "server/auth.js changed since $LAST_DEPLOYED: the auth service will be restarted"
          else
            echo "server/auth.js unchanged since $LAST_DEPLOYED: the auth service will be left running"
          fi

          echo "==> Install, type-check and build"
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          node --check server/auth.js
          npm run build
          test -s dist/index.html || { echo "ERROR: build produced no dist/index.html"; exit 1; }

          echo "==> Back up the current site"
          STAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP="$BACKUP_ROOT/$STAMP"
          mkdir -p "$BACKUP"
          if [ -d "$WEB_ROOT" ]; then
            cp -a "$WEB_ROOT/." "$BACKUP/" || { echo "ERROR: could not back up $WEB_ROOT"; exit 1; }
          fi
          echo "backup: $BACKUP"

          echo "==> Publish static site"
          if [ "$PUBLISH_MODE" = "direct" ]; then
            cp -a "$APP_DIR/dist/." "$WEB_ROOT/" || { echo "::error::could not publish to $WEB_ROOT"; exit 1; }
          else
            if ! sudo -n cp -a "$APP_DIR/dist/." "$WEB_ROOT/"; then
              echo "::error::could not publish to $WEB_ROOT - passwordless sudo is not configured on the VPS"
              echo "Run this ONCE on the VPS, then re-run the workflow:"
              echo "  $SUDOERS_FIX"
              echo "Or hand the web root to the deploy user instead:"
              echo "  sudo chown -R $(id -un):www-data $WEB_ROOT"
              exit 1
            fi
          fi
          echo "published to $WEB_ROOT"

          if [ "$AUTH_CHANGED" = "1" ]; then
            echo "==> Restart auth service"
            if ! sudo -n systemctl restart "$SERVICE"; then
              echo "::error::the site was published, but $SERVICE could not be restarted - passwordless sudo is not configured on the VPS"
              echo "Run this ONCE on the VPS, then re-run the workflow:"
              echo "  $SUDOERS_FIX"
              exit 1
            fi
            i=1
            while [ "$i" -le 15 ]; do
              if curl --fail --silent "$HEALTH_URL" >/dev/null 2>&1; then
                echo "auth service healthy"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "ERROR: $HEALTH_URL did not become healthy after restart"
                echo "Roll the site back with: cp -a \"$BACKUP/.\" $WEB_ROOT/"
                exit 1
              fi
              i=$((i + 1))
              sleep 1
            done
          else
            echo "==> Auth service left running (no server/auth.js change); health check only"
            if curl --fail --silent "$HEALTH_URL" >/dev/null 2>&1; then
              echo "auth service healthy"
            else
              echo "WARNING: $HEALTH_URL is not answering (the static site was published anyway)"
            fi
          fi

          git rev-parse HEAD > "$MARKER"
          echo "==> Deployed $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"
          echo "Backup kept at $BACKUP"
          REMOTE

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deploy finished for ${{ github.sha }}."
          else
            echo "Deploy failed for ${{ github.sha }}. The previous build stays live unless the publish step already ran; roll back with the newest /var/www/html.backup-* directory."
          fi
