name: Notify Discord about Meta Code website updates

on:
  workflow_run:
    workflows:
      - Deploy Meta CodeLearn to VPS
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send website update to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SITE_WEBHOOK_URL }}
          SITE_URL: https://metacodework.dbm.shared-servers.com
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || 'v1.0.0' }}
          COMMIT_TITLE: "${{ github.event.workflow_run.head_commit.message || 'TEST - Previous update: ticket deletion scheduler fix (PR #56), version 1.0.0' }}"
          COMMIT_URL: ${{ github.event.workflow_run.head_commit.url || 'https://github.com/tayven772-pixel/meta-codelearn/pull/56' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || github.server_url }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_SITE_WEBHOOK_URL secret is not configured; skipping Discord notification."
            exit 0
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          export SHORT_SHA
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          # Send only after every third successful deployment workflow run.
          # Manual workflow_dispatch remains available for testing.
          if os.environ.get("EVENT_NAME") != "workflow_dispatch":
              workflow_id = os.environ.get("DEPLOY_WORKFLOW_ID", "")
              if not workflow_id:
                  print("No deployment workflow ID found; skipping notification.")
                  raise SystemExit(0)
              api_url = (
                  f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/"
                  f"{workflow_id}/runs?status=success&per_page=1"
              )
              api_request = urllib.request.Request(
                  api_url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(api_request, timeout=15) as response:
                  successful_runs = json.load(response).get("total_count", 0)
              print(f"Successful deployment runs so far: {successful_runs}")
              if successful_runs % 3 != 0:
                  print("Not the third update yet; skipping Discord notification.")
                  raise SystemExit(0)

          title = os.environ.get("COMMIT_TITLE", "Website update").splitlines()[0][:240]
          payload = {
              "username": "Meta Code Updates",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": "🌐 Meta Code website updated!",
                  "description": f"A new website update has successfully deployed.\n\n**[Website]({os.environ['SITE_URL']})**",
                  "color": 5793266,
                  "fields": [
                      {"name": "Update", "value": title or "Website update", "inline": False},
                      {"name": "Version / Previous update", "value": f"[{os.environ['SHORT_SHA']}]({os.environ['COMMIT_URL']})", "inline": True}
                  ],
                  "footer": {"text": "Meta Code • Automated deployment notice"}
              }],
              "components": [{
                  "type": 1,
                  "components": [
                      {"type": 2, "style": 5, "label": "View Deployment", "url": os.environ["RUN_URL"]}
                  ]
              }]
          }

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={
                "Content-Type": "application/json",
                "User-Agent": "DiscordBot (https://github.com/tayven772-pixel/meta-codelearn, 1.0)",
            },
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              # Print Discord's diagnostic response, but never print the webhook URL.
              detail = error.read().decode("utf-8", errors="replace")[:1000]
              print(f"Discord webhook rejected the request: HTTP {error.code}")
              print(f"Discord response: {detail}")
              raise
          print("Discord website update notification sent.")
          PY