name: Deploy Meta CodeLearn to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type "deploy" to publish the current main branch to the VPS
        required: true
        type: choice
        options:
          - cancel
          - deploy

permissions:
  contents: read

concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || inputs.confirm_deploy == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}   # optional secret; defaults to 10058 in the steps
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Check authentication and Discord OAuth syntax
        run: |
          node --check server/auth.js
          node --check api/auth/discord.js
          node --check api/auth/callback.js
          node --check discord-bot/src/index.js

      - name: Build production website
        run: npm run build

      - name: Verify build output
        run: test -s dist/index.html

      - name: Configure SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_SSH_KEY_B64" || { echo "Missing repository secret VPS_SSH_KEY_B64"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing repository secret VPS_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload built site to temporary staging directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -eu
          test -n "$VPS_HOST" || { echo "Missing repository secret VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing repository secret VPS_USER"; exit 1; }
          : "${VPS_SSH_PORT:=10058}"   # default to 10058 if secret not set
          STAGING="/tmp/meta-codelearn-dist-$DEPLOY_SHA"
          SSH="ssh -p $VPS_SSH_PORT -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$VPS_USER@$VPS_HOST" "mkdir -p '$STAGING'"
          scp -P "$VPS_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -r dist/. "$VPS_USER@$VPS_HOST:$STAGING/"
          scp -P "$VPS_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes server/auth.js "$VPS_USER@$VPS_HOST:/tmp/meta-codelearn-auth-$DEPLOY_SHA.js"
          scp -P "$VPS_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes api/auth/discord.js "$VPS_USER@$VPS_HOST:/tmp/meta-codelearn-discord-start-$DEPLOY_SHA.js"
          scp -P "$VPS_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes api/auth/callback.js "$VPS_USER@$VPS_HOST:/tmp/meta-codelearn-discord-callback-$DEPLOY_SHA.js"
          scp -P "$VPS_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes lib/discord-auth.js "$VPS_USER@$VPS_HOST:/tmp/meta-codelearn-discord-auth-lib-$DEPLOY_SHA.js"
          scp -P "$VPS_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes discord-bot/src/index.js "$VPS_USER@$VPS_HOST:/tmp/meta-codelearn-bot-index-$DEPLOY_SHA.js"

      - name: Back up and publish site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -eu
          : "${VPS_SSH_PORT:=10058}"
          STAGING="/tmp/meta-codelearn-dist-$DEPLOY_SHA"
          ssh -p "$VPS_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -s -- '$STAGING' '$DEPLOY_SHA'" <<'REMOTE'
          set -eu
          STAGING="$1"
          DEPLOY_SHA="$2"
          test -s "$STAGING/index.html"
          AUTH_STAGE="/tmp/meta-codelearn-auth-$DEPLOY_SHA.js"
          DISCORD_START_STAGE="/tmp/meta-codelearn-discord-start-$DEPLOY_SHA.js"
          DISCORD_CALLBACK_STAGE="/tmp/meta-codelearn-discord-callback-$DEPLOY_SHA.js"
          DISCORD_AUTH_LIB_STAGE="/tmp/meta-codelearn-discord-auth-lib-$DEPLOY_SHA.js"
          BOT_INDEX_STAGE="/tmp/meta-codelearn-bot-index-$DEPLOY_SHA.js"
          test -s "$AUTH_STAGE"
          test -s "$DISCORD_START_STAGE"
          test -s "$DISCORD_CALLBACK_STAGE"
          test -s "$DISCORD_AUTH_LIB_STAGE"
          test -s "$BOT_INDEX_STAGE"
          BACKUP="/var/www/html.backup-$DEPLOY_SHA-$(date +%Y%m%d-%H%M%S)"
          AUTH_BACKUP="/opt/meta-codelearn/server/auth.js.backup-$DEPLOY_SHA"
          DISCORD_START_BACKUP="/opt/meta-codelearn/api/auth/discord.js.backup-$DEPLOY_SHA"
          DISCORD_CALLBACK_BACKUP="/opt/meta-codelearn/api/auth/callback.js.backup-$DEPLOY_SHA"
          DISCORD_AUTH_LIB_BACKUP="/opt/meta-codelearn/lib/discord-auth.js.backup-$DEPLOY_SHA"
          BOT_INDEX_BACKUP="/opt/meta-codelearn/discord-bot/src/index.js.backup-$DEPLOY_SHA"
          NGINX_SNIPPET="/etc/nginx/snippets/meta-codelearn-auth.conf"
          NGINX_BACKUP="$NGINX_SNIPPET.backup-$DEPLOY_SHA"
          sudo -n cp -a /var/www/html "$BACKUP"
          sudo -n cp -a /opt/meta-codelearn/server/auth.js "$AUTH_BACKUP"
          sudo -n cp -a /opt/meta-codelearn/api/auth/discord.js "$DISCORD_START_BACKUP"
          sudo -n cp -a /opt/meta-codelearn/api/auth/callback.js "$DISCORD_CALLBACK_BACKUP"
          sudo -n cp -a /opt/meta-codelearn/lib/discord-auth.js "$DISCORD_AUTH_LIB_BACKUP"
          sudo -n cp -a /opt/meta-codelearn/discord-bot/src/index.js "$BOT_INDEX_BACKUP"
          sudo -n cp -a "$NGINX_SNIPPET" "$NGINX_BACKUP"
          if ! sudo -n grep -Fq 'location = /api/auth/content' "$NGINX_SNIPPET"; then
            sudo -n tee -a "$NGINX_SNIPPET" >/dev/null <<'NGINX'
          location = /api/auth/content {
            proxy_pass http://127.0.0.1:3001/api/auth/content;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
          }
          NGINX
          fi
          if ! sudo -n grep -Fq 'location = /api/auth/admin/content' "$NGINX_SNIPPET"; then
            sudo -n tee -a "$NGINX_SNIPPET" >/dev/null <<'NGINX'
          location = /api/auth/admin/content {
            proxy_pass http://127.0.0.1:3001/api/auth/admin/content;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
          }
          NGINX
          fi
          if sudo -n grep -q '^META_ADMIN_EMAILS=' /etc/meta-codelearn-auth.env; then
            if ! sudo -n sed -n 's/^META_ADMIN_EMAILS=//p' /etc/meta-codelearn-auth.env | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -Fqx 'metasupport43@gmail.com'; then
              sudo -n sed -i '/^META_ADMIN_EMAILS=/ s/$/,metasupport43@gmail.com/' /etc/meta-codelearn-auth.env
            fi
          else
            printf '%s\n' 'META_ADMIN_EMAILS=metasupport43@gmail.com' | sudo -n tee -a /etc/meta-codelearn-auth.env >/dev/null
          fi
          if ! sudo -n nginx -t; then
            sudo -n cp -a "$NGINX_BACKUP" "$NGINX_SNIPPET"
            sudo -n nginx -t || true
            echo "Nginx configuration test failed; the previous auth proxy snippet was restored."
            exit 1
          fi
          sudo -n cp -a "$STAGING/." /var/www/html/
          sudo -n cp -a "$AUTH_STAGE" /opt/meta-codelearn/server/auth.js
          sudo -n cp -a "$DISCORD_START_STAGE" /opt/meta-codelearn/api/auth/discord.js
          sudo -n cp -a "$DISCORD_CALLBACK_STAGE" /opt/meta-codelearn/api/auth/callback.js
          sudo -n cp -a "$DISCORD_AUTH_LIB_STAGE" /opt/meta-codelearn/lib/discord-auth.js
          sudo -n cp -a "$BOT_INDEX_STAGE" /opt/meta-codelearn/discord-bot/src/index.js
          sudo -n nginx -t
          sudo -n systemctl reload nginx

          # Restart and health-check the settings API before attempting the bot restart.
          # The VPS sudoers may allow auth restarts but not Discord bot restarts.
          if ! sudo -n systemctl restart meta-codelearn-auth.service; then
            sudo -n cp -a "$AUTH_BACKUP" /opt/meta-codelearn/server/auth.js
            sudo -n cp -a "$DISCORD_START_BACKUP" /opt/meta-codelearn/api/auth/discord.js
            sudo -n cp -a "$DISCORD_CALLBACK_BACKUP" /opt/meta-codelearn/api/auth/callback.js
            sudo -n cp -a "$DISCORD_AUTH_LIB_BACKUP" /opt/meta-codelearn/lib/discord-auth.js
            sudo -n systemctl restart meta-codelearn-auth.service || true
            echo "Auth service restart failed; previous auth server files restored."
            exit 1
          fi
          AUTH_HEALTHY=0
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/api/health >/dev/null; then
              AUTH_HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$AUTH_HEALTHY" -ne 1 ]; then
            echo "Auth health check failed after retries; collecting service logs."
            sudo -n journalctl -u meta-codelearn-auth.service -n 25 --no-pager || true
            sudo -n cp -a "$AUTH_BACKUP" /opt/meta-codelearn/server/auth.js
            sudo -n cp -a "$DISCORD_START_BACKUP" /opt/meta-codelearn/api/auth/discord.js
            sudo -n cp -a "$DISCORD_CALLBACK_BACKUP" /opt/meta-codelearn/api/auth/callback.js
            sudo -n cp -a "$DISCORD_AUTH_LIB_BACKUP" /opt/meta-codelearn/lib/discord-auth.js
            sudo -n systemctl restart meta-codelearn-auth.service || true
            echo "Previous auth server files restored."
            exit 1
          fi

          # Bot code is staged safely. A missing sudo permission for this service
          # must not prevent the website and settings API from being published.
          if sudo -n systemctl restart meta-codelearn-discord.service; then
            sleep 3
            if sudo -n systemctl is-active --quiet meta-codelearn-discord.service; then
              echo "Discord bot service restarted successfully."
            else
              echo "WARNING: website and settings API deployed, but Discord bot service is not active; check VPS service permissions/logs."
              sudo -n journalctl -u meta-codelearn-discord.service -n 15 --no-pager || true
            fi
          else
            echo "WARNING: website and settings API deployed, but sudo cannot restart meta-codelearn-discord.service. Bot code is staged on the VPS; grant the deploy user permission to restart this service to apply bot code changes."
          fi
          rm -rf "$STAGING"
          rm -f "$AUTH_STAGE" "$DISCORD_START_STAGE" "$DISCORD_CALLBACK_STAGE" "$DISCORD_AUTH_LIB_STAGE" "$BOT_INDEX_STAGE"
          echo "Website, auth server, Discord bot entrypoint, Discord OAuth routes, and versioned Discord session library deployed. Website backup: $BACKUP; auth backup: $AUTH_BACKUP; Discord route backups: $DISCORD_START_BACKUP, $DISCORD_CALLBACK_BACKUP; session library backup: $DISCORD_AUTH_LIB_BACKUP; Nginx snippet backup: $NGINX_BACKUP"
          REMOTE
