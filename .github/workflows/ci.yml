name: Validate Meta CodeLearn

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check authentication server syntax
        run: node --check server/auth.js

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build production website
        run: npm run build

      - name: Confirm build output exists
        run: test -s dist/index.html

  discord-bot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: discord-bot/package-lock.json

      - name: Install locked bot dependencies
        run: npm ci

      - name: Check bot JavaScript syntax
        run: |
          set -eu
          find src scripts test -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Run Discord bot tests
        run: npm test
