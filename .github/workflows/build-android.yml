name: Build Meta Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: meta-android
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Restore release signing key
        env:
          META_KEYSTORE_BASE64: ${{ secrets.META_KEYSTORE_BASE64 }}
        run: |
          test -n "$META_KEYSTORE_BASE64" || { echo "META_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$META_KEYSTORE_BASE64" | base64 --decode > android/app/meta-release.jks

      - name: Configure release signing
        env:
          META_STORE_PASSWORD: ${{ secrets.META_STORE_PASSWORD }}
          META_KEY_PASSWORD: ${{ secrets.META_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("android {", """android {
              signingConfigs {
                  release {
                      storeFile file("meta-release.jks")
                      storePassword System.getenv("META_STORE_PASSWORD")
                      keyAlias "meta"
                      keyPassword System.getenv("META_KEY_PASSWORD")
                  }
              }""", 1)
          s = s.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          META_STORE_PASSWORD: ${{ secrets.META_STORE_PASSWORD }}
          META_KEY_PASSWORD: ${{ secrets.META_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Publish APK to website
        run: |
          set -euo pipefail
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_SOURCE"
          # Keep the generated APK outside the checkout before switching to latest main.
          # Checking out main can remove ignored/untracked build output under android/.
          cp "$APK_SOURCE" "$RUNNER_TEMP/Meta-latest.apk"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p public/downloads android/app/build/outputs/apk/release
          cp "$RUNNER_TEMP/Meta-latest.apk" public/downloads/Meta-latest.apk
          cp "$RUNNER_TEMP/Meta-latest.apk" android/app/build/outputs/apk/release/app-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/Meta-latest.apk
          if git diff --cached --quiet; then
            echo "Published APK is already current."
          else
            git commit -m "Update downloadable Meta APK [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Meta-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
